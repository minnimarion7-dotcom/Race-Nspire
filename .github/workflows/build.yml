name: Build TI-Nspire RACE

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your code
        uses: actions/checkout@v4

      - name: Install Ndless SDK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3-dev libgmp-dev libmpfr-dev libmpc-dev zlib1g-dev libboost-program-options-dev wget texinfo

      - name: Download prebuilt Ndless SDK
        run: |
          git clone --recursive https://github.com /tmp/ndless
          cd /tmp/ndless/ndless-sdk/toolchain
          ./build_toolchain.sh

      - name: Compile RACE for Nspire
        env:
          PATH: "/tmp/ndless/ndless-sdk/toolchain/install/bin:/tmp/ndless/ndless-sdk/bin:${{ env.PATH }}"
        run: |
          make -f Makefile.nsp

      - name: Upload .tns file
        uses: actions/upload-artifact@v4
        with:
          name: race-nspire
          path: race.tns
